; ============================================================
;  Digimon Color Port - ESP32-C3 + TFT ST7735
; ============================================================
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -- Bibliotecas --
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; -- Flags de build --
; IMPORTANTE: a TFT_eSPI é configurada via build_flags (evita editar
; User_Setup.h dentro da lib, o que quebra em cada `pio lib update`).
; Ajuste os pinos abaixo conforme sua fiação real do ST7735.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_GREENTAB2=1        ; troque conforme o modelo do seu display
    -D TFT_MISO=-1
    -D TFT_MOSI=6
    -D TFT_SCLK=4
    -D TFT_CS=7
    -D TFT_DC=10
    -D TFT_RST=2
    -D TFT_BL=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
